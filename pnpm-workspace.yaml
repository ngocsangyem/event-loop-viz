overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'
  'typescript': 'npm:typescript-native-bridge@latest'

peerDependencyRules:
  allowAny:
    - 'vue'

patchedDependencies:
  '@engine262/engine262': patches/@engine262__engine262.patch

# Supply-chain guard: only resolve versions published at least one day ago (minutes).
minimumReleaseAge: 1440
