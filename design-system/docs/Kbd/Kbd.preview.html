    <section data-story="InProse">
      <p style="margin:0;font:400 var(--text-body)/22px var(--font-sans);color:var(--color-ink-2)">Press <elv-kbd>⌘↵</elv-kbd> to record a Trace, then <elv-kbd>␣</elv-kbd> to play it back.</p>

    <section data-story="KeyboardMap">
